['ستاردو فالي','لعبة محاكاة','مزرعة','حياة ريفية','صنعها شخص واحد','زراعة وصيد']]);

ad('games','شخصيات ألعاب',[['سولد سنيك','شخصية','جندي متسلل','صندوق كرتون','سلسلة ميتال غير','من كونامي']]);
ad('music_art','آلات موسيقية',[['الغيتار','آلة وترية','ست أوتار','يُعزف بالأصابع أو الريشة','كلاسيكي وكهربائي','ارتبط بالروك']]);
D.org.d=D.org.d.filter(x=>x[0]!='فيفا'&&x[0]!='جوائز نوبل');
ad('org','منظمات دولية وإقليمية',[['الإنتربول','منظمة','شرطة دولية','مقرها ليون','تصدر نشرات حمراء','تأسست عام ١٩٢٣']]);
ad('org','مؤسسات علمية وثقافية',[
['جامعة هارفارد','جامعة أمريكية','أقدم جامعة في أمريكا','في كامبريدج بماساتشوستس','تأسست عام ١٦٣٦','شعارها فيريتاس'],
['المتحف البريطاني','متحف','في لندن','فيه حجر رشيد','يضم مومياوات','دخوله مجاني']]);
Object.values(D).forEach(c=>{const s=new Set();c.d=c.d.filter(x=>!s.has(x[0])&&s.add(x[0]))});
const K=Object.keys(D),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C=['#4f46e5','#e11d74','#0e9f6e','#d97706','#0891b2','#7c3aed','#dc2626','#2563eb','#0f766e','#c2410c','#4d7c0f','#db2777'];
let S={v:'setup',md:'rot',pl:['',''],k:1,sc:[],r:0,u:new Set(),cur:null,h:1,res:null};
const A=document.getElementById('a'),T=()=>S.md=='fix'?10*S.k:S.pl.length*S.k,M=()=>S.md=='fix'?0:S.r%S.pl.length;
function add(){if(S.pl.length<12){S.pl.push('');R()}}
function rm(i){if(S.pl.length>2){S.pl.splice(i,1);R()}}
function kk(n){S.k=n;R()}
function md(m){S.md=m;S.k=1;R()}
function go(){S.pl=S.pl.map((n,i)=>n.trim()||'لاعب '+(i+1));S.sc=S.pl.map(()=>0);S.r=0;S.v='home';R()}
function cat(k){const sb=[...new Set(D[k].d.map(c=>c[6]).filter(Boolean))];if(sb.length<2)return pick(k);S.kc=k;S.v='sub';R()}
function pick(k,s){S.q=k;S.s=s;const ks=k?[k]:K,pool=[];ks.forEach(x=>D[x].d.forEach((c,i)=>{if(!S.u.has(x+i)&&(!s||c[6]==s))pool.push([x,c])}));
if(!pool.length){ks.forEach(x=>D[x].d.forEach((c,i)=>{if(!s||c[6]==s)S.u.delete(x+i)}));return pick(k,s)}
const src=pool.filter(z=>!S.cur||z[1]!==S.cur.c),q=src.length?src:pool,[x,c]=q[Math.floor(Math.random()*q.length)];S.u.add(x+D[x].d.indexOf(c));S.cur={k:x,c};S.h=1;S.v='card';R()}
function back(){const q=S.q,sb=q?new Set(D[q].d.map(c=>c[6]).filter(Boolean)).size:0;if(S.v=='card'&&sb>1){S.v='sub';S.kc=q}else S.v='home';R()}
function nx(){if(S.h<5){S.h++;R()}}
function ok(i){S.sc[i]++;S.res=S.pl[i]+' +١';S.v='res';R()}
function sk(){S.res='لم يُجب أحد';S.v='res';R()}
function nxt(){S.r++;S.v=S.r>=T()?'end':'home';R()}
function again(){S.v='setup';R()}
function chips(){return `<div class="ch">${S.pl.map((n,i)=>`<div style="background:${C[i]}${i==M()?';outline:3px solid var(--hl);outline-offset:2px':''}">${esc(n)}<b>${S.md=='fix'&&i==0?'👑':S.sc[i]}</b></div>`).join('')}</div>`}
function R(){let h='';const ct=S.cur&&D[S.cur.k],st=ct?`style="--c:${ct.c}"`:'';
const hd=S.v=='home'||S.v=='sub'||S.v=='card'||S.v=='res'?`<p>الجولة ${S.r+1} من ${T()} · المدير: <b style="color:var(--fg)">${esc(S.pl[M()])}</b></p>`+chips():'';
if(S.v=='setup')h=`<div class="logo">Hints<i>💡</i></div><p>لعبة فردية: يتبادل اللاعبون دور المدير، وكل إجابة صحيحة بنقطة.</p>`+S.pl.map((n,i)=>`<div class="pr"><input value="${esc(n)}" placeholder="${S.md=='fix'&&i==0?'المدير':'اللاعب '+(i+1)}" aria-label="اسم اللاعب ${i+1}" oninput="S.pl[${i}]=this.value" style="border-color:${C[i]}"><button class="s" onclick="rm(${i})" ${S.pl.length<=2?'disabled':''} aria-label="حذف">✕</button></div>`).join('')+`<button class="s w" onclick="add()" ${S.pl.length>=12?'disabled':''}>+ إضافة لاعب</button><p style="margin-top:14px">طريقة اللعب:</p><div class="row"><button class="${S.md=='rot'?'y':'s'}" onclick="md('rot')">اللاعبون يسألون بالتناوب</button><button class="${S.md=='fix'?'y':'s'}" onclick="md('fix')">المدير يسأل دائمًا</button></div><p style="margin-top:14px">${S.md=='fix'?'أول اسم في القائمة هو المدير ولا يجمع نقاطًا. عدد الأسئلة:':'عدد مرات إدارة كل لاعب:'}</p><div class="row">${[1,2,3].map(n=>`<button class="${S.k==n?'y':'s'}" onclick="kk(${n})">${S.md=='fix'?n*10:n}</button>`).join('')}</div><button class="w y" style="margin-top:16px" onclick="go()">ابدأ اللعبة</button>`;
else if(S.v=='home')h=hd+`<p>اختر القسم، ثم اقرأ التلميحات بصوت عالٍ.</p><button class="w y" onclick="pick()">🎲 بطاقة عشوائية</button><div class="g">${K.map(k=>`<button style="--c:${D[k].c}" onclick="cat('${k}')"><span>${D[k].i}</span>${D[k].n}</button>`).join('')}</div>`;
else if(S.v=='sub'){const d=D[S.kc],sb=[...new Set(d.d.map(c=>c[6]).filter(Boolean))];h=hd+`<div class="bn" style="--c:${d.c}"><span>${d.i}</span><b>${d.n}</b><button class="s" style="margin-inline-start:auto;padding:8px 12px" onclick="back()">رجوع ↩</button></div><button class="w y" onclick="pick('${S.kc}')">🎲 كل الأنواع</button><div class="g">${sb.map(x=>`<button style="--c:${d.c}" onclick="pick('${S.kc}','${x}')">${x}<small>${d.d.filter(c=>c[6]==x).length} بطاقات</small></button>`).join('')}</div>`}
else if(S.v=='card'){const c=S.cur.c;h=`<div ${st}>`+hd+`<div class="bn"><span>${ct.i}</span><b>${ct.n}</b><button class="s" style="margin-inline-start:auto;padding:8px 12px" onclick="back()">رجوع ↩</button></div>`+c.slice(1,S.h+1).map((t,i)=>`<div class="h ${i+1==S.h?'n':''}"><small>${i+1}</small>${esc(t)}</div>`).join('')+`<details class="an"><summary>الإجابة (للمدير فقط)</summary><b>${esc(c[0])}</b></details><p>من أجاب صح؟</p><div class="g2">${S.pl.map((n,i)=>i==M()?`<button class="s" disabled>${esc(n)} · المدير</button>`:`<button style="background:${C[i]}" onclick="ok(${i})">${esc(n)}</button>`).join('')}</div><div class="row"><button class="y" onclick="nx()" ${S.h>=5?'disabled':''}>التلميح التالي</button><button class="s" onclick="sk()">لم يُجب أحد</button></div><button class="s w" style="margin-top:10px" onclick="pick(S.q,S.s)">🔄 غيّر السؤال</button></div>`}
else if(S.v=='res')h=hd+`<div class="bn" ${st}><span>${ct.i}</span><b>${ct.n}</b></div><p style="text-align:center">الإجابة كانت</p><div class="big">${esc(S.cur.c[0])}</div><p style="text-align:center">${esc(S.res)}</p><button class="w y" onclick="nxt()">${S.r+1>=T()?'النتيجة النهائية':'الجولة التالية'}</button>`;
else{const o=S.pl.map((n,i)=>i).filter(i=>S.md!='fix'||i!=0).sort((a,b)=>S.sc[b]-S.sc[a]),mx=S.sc[o[0]],ws=o.filter(i=>S.sc[i]==mx).map(i=>S.pl[i]);
h=`<div class="logo" style="text-align:center">🏆</div><div class="big">${ws.length>1?'تعادل: ':'الفائز: '}${esc(ws.join(' و '))}</div>`+o.map((i,j)=>`<div class="rk" style="border-color:${C[i]}"><span>${['🥇','🥈','🥉'][j]||j+1}</span>${esc(S.pl[i])}<b>${S.sc[i]}</b></div>`).join('')+`<button class="w y" style="margin-top:14px" onclick="again()">لعبة جديدة</button>`}
A.innerHTML=h}
R();
</script></body></html>
